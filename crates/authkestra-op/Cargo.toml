[package]
exclude.workspace = true
name = "authkestra-op"
version.workspace = true
edition.workspace = true
description = "OpenID Provider (OP) support for the authkestra framework — issue tokens and run the authorization code grant, rather than only consuming an external IdP"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
authkestra-engine = { workspace = true, features = ["token", "memory"] }
authkestra-resource = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tracing = "0.1.44"
rand = { workspace = true }
base64 = "0.22.1"
url = { workspace = true }
sha2 = { workspace = true }
argon2 = "0.5.3"
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio", "json", "chrono"] }

[features]
sqlx = ["dep:sqlx"]
sqlx-postgres = ["sqlx", "sqlx/postgres"]
sqlx-sqlite = ["sqlx", "sqlx/sqlite"]
sqlx-mysql = ["sqlx", "sqlx/mysql"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mysql"] }
# Test-only: generating real EC P-256 keypairs and signing enrolment
# challenges with them, to exercise the attestation ceremony end-to-end
# rather than mocking the crypto away. Already present in the dependency
# graph via jsonwebtoken's `rust_crypto` feature; declared directly here so
# tests can construct keys themselves.
p256 = { version = "0.13", features = ["jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
