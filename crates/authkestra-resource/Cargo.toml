[package]
exclude.workspace = true
name = "authkestra-resource"
version.workspace = true
edition.workspace = true
description = "Resource server enforcement and validation for the authkestra framework"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
authkestra-engine = { workspace = true, default-features = false, features = ["token", "memory"] }
async-trait = "0.1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# TLS backend comes from authkestra-engine's `rustls-*` features (see below).
reqwest = { version = "0.13.1", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0.18"
http = "1"
base64 = "0.22.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["rustls-aws-lc-rs"]

# TLS backend, forwarded to authkestra-engine. See its documentation for the
# `rustls-no-provider` contract.
rustls-aws-lc-rs = ["authkestra-engine/rustls-aws-lc-rs"]
rustls-no-provider = ["authkestra-engine/rustls-no-provider"]

[dev-dependencies]
wiremock = "0.6"
rsa = "0.9.6"
rand = "0.8"
# Test-only: signing genuine DPoP proofs for JwtStrategy's DPoP-binding
# tests, mirroring authkestra-engine's own token::dpop test suite.
ed25519-dalek = "2"
