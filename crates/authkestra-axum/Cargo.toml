[package]
exclude.workspace = true
name = "authkestra-axum"
version.workspace = true
edition.workspace = true
description = "Axum integration for the authkestra authentication framework"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
authkestra-engine = { workspace = true, default-features = false, features = ["token"] }
authkestra-resource = { workspace = true, optional = true, default-features = false }
authkestra-macros = { workspace = true, optional = true, features = ["axum"] }
authkestra-op = { workspace = true, optional = true, default-features = false }
authkestra-devsig = { workspace = true, optional = true }
axum = { version = "0.8.8", features = ["macros"] }
jsonwebtoken = "11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-cookies = "0.11.0"
base64 = "0.22.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

# Optional devsig integration: a tower::Layer that buffers+hashes the body ahead of axum's
# extraction, plus a thin FromRequestParts extractor. See src/devsig.rs.
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }



[features]
default = ["macros", "rustls-aws-lc-rs"]
macros = ["authkestra-macros"]
session = ["authkestra-engine/session"]

token = ["authkestra-engine/token"]
resource = ["dep:authkestra-resource"]
op = ["dep:authkestra-op", "session", "token"]
captcha = ["authkestra-engine/captcha"]
devsig = [
    "dep:authkestra-devsig",
    "dep:tower-layer",
    "dep:tower-service",
    "dep:http-body-util",
    "dep:bytes",
]

# TLS backend, forwarded to authkestra-engine. See its documentation for the
# `rustls-no-provider` contract.
rustls-aws-lc-rs = [
    "authkestra-engine/rustls-aws-lc-rs",
    "authkestra-resource?/rustls-aws-lc-rs",
    "authkestra-op?/rustls-aws-lc-rs",
]
rustls-no-provider = [
    "authkestra-engine/rustls-no-provider",
    "authkestra-resource?/rustls-no-provider",
    "authkestra-op?/rustls-no-provider",
]

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

# Integration tests drive the real `axum::Router` produced by `Engine::axum_router()`
# / `axum_router_stateless()`, so they need the corresponding adapter features. Kept
# as separate `[[test]]` targets (rather than `#[cfg(feature = ...)]` inside one file)
# so `cargo test -p authkestra-axum` without `--all-features` simply skips them instead
# of failing to compile, matching the pattern used by `authkestra`'s `typestate_tests`.
[[test]]
name = "engine_session_integration"
required-features = ["macros", "session"]

[[test]]
name = "engine_token_integration"
required-features = ["macros", "token"]
