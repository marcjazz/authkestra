[package]
name = "authkestra-store-testsuite"
description = "Generic conformance test suite for authkestra's storage traits (KvStore, OpStore, ClientAssertionStore) — proves a first- or third-party backend honors the contracts those traits require"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["testing", "conformance", "authentication"]
categories = ["authentication", "development-tools"]
readme.workspace = true
exclude.workspace = true

[dependencies]
# `default-features = true` overrides the `false` set on these in
# `[workspace.dependencies]` (there for crates that need to pick their own
# TLS backend) — this crate has no such choice to make, so it just wants
# each dependency's own defaults (its TLS backend included).
authkestra-engine = { workspace = true, default-features = true }
authkestra-op = { workspace = true, default-features = true }
# Only "rt" (tokio::spawn, in the atomic-insert concurrency test) and
# "time" (tokio::time::sleep, waiting out a TTL) are actually used by
# src/ — "full" would push tokio's entire feature set onto every consumer
# of this now-published crate for no reason.
tokio = { version = "1", features = ["rt", "time"] }
async-trait = "0.1"
# Only the CredentialStore suite needs it (credentials are JSON blobs), but
# an optional dependency activated by that feature is simpler than the
# alternative and it is already in every consumer's graph via the engine.
serde_json = { version = "1", optional = true }

[features]
# The `CredentialStore` conformance suite. `authkestra-engine` gates
# `auth::store` behind the methods that enrol something, so the trait is only
# in scope when one of them is on — `totp` is the cheapest that exposes it.
# Opt-in, so a consumer wanting only the KvStore suites pays nothing.
credential-store = ["authkestra-engine/totp", "dep:serde_json"]

[dev-dependencies]
# Only this crate's own `tests/redis_store.rs` needs the `redis` feature —
# declaring it here (rather than in `[dependencies]`) keeps it out of the
# feature set a consumer pulls in merely by depending on this crate, and
# out of the feature-unification a *dev*-dependent (e.g. authkestra-engine
# itself, which dev-depends on this crate to self-test) gets forced into.
authkestra-engine = { workspace = true, default-features = true, features = [
    "redis",
    # Only `tests/sqlx_store.rs` needs these: `sql-sqlite` for
    # `SqlxCredentialStore`, and `totp` because that is what puts
    # `CredentialStore` in scope at all.
    "sql-sqlite",
    "totp",
] }
authkestra-op = { workspace = true, default-features = true, features = ["redis"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["redis", "postgres", "mysql"] }
# Deliberately path-only, no version (not `workspace = true`, which would
# inherit one): a dev-dependency *with* a version isn't stripped from the
# published manifest, so `cargo package` needs it already on crates.io.
# authkestra-store-sqlx is published for the first time in the same
# release batch as this crate, so at packaging time it never is yet —
# "no matching package named `authkestra-store-sqlx` found" (authkestra
# release-plz run, 2026-09-03). Version-less path dev-deps are dropped
# from the published manifest entirely, sidestepping the whole problem;
# the only cost is that `tests/sqlx_store.rs` can't run against a copy
# installed from crates.io, which was never a supported use case anyway.
authkestra-store-sqlx = { path = "../authkestra-store-sqlx", default-features = true, features = [
    "sqlite",
] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
# This crate's own tests/*.rs use #[tokio::test], which needs "macros" —
# declared explicitly rather than relying on it arriving via
# feature-unification from testcontainers' own tokio dependency.
tokio = { version = "1", features = ["macros", "rt"] }

# Only built when the feature it needs is on. Without this the target would
# fail to compile under a plain `cargo test -p authkestra-store-testsuite`,
# and pass in CI purely because CI happens to use `--all-features`.
[[test]]
name = "sqlx_credential_store"
required-features = ["credential-store"]
