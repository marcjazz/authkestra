[package]
exclude.workspace = true
name = "authkestra-devsig"
version.workspace = true
edition.workspace = true
description = "Device-bound signature authentication for the authkestra framework: per-request proof-of-possession signing plus an issuer-attested key binding, verifiable with no session store and no per-request network call"
repository.workspace = true
license.workspace = true
# This is the least common pattern in the workspace, so its keywords lean
# on the vocabulary someone would actually type for it rather than the
# generic "authentication" umbrella, which this crate barely resembles.
keywords = ["proof-of-possession", "attestation", "signatures", "device-binding", "authentication"]
categories = ["authentication", "cryptography"]
readme = "README.md"

[dependencies]
async-trait = "0.1"
# Direct, not transitive-by-accident: `crate::eddsa` calls `VerifyingKey::verify_strict` itself
# because `jsonwebtoken`'s EdDSA backend uses the non-strict verifier (authkestra#242). This adds
# no new code to the dependency graph — `jsonwebtoken`'s `rust_crypto` backend, already enabled
# above, resolves the same `ed25519-dalek` 2.x.
ed25519-dalek = "2"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
base64 = "0.22.1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
authkestra-crypto-util.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rsa = "0.9"
p256 = { version = "0.13", features = ["pem", "ecdsa"] }
rand = "0.8"
# `pkcs8` only, and only for tests: the conformance suite needs to mint a *real* Ed25519 device
# key in the PKCS#8 DER shape `jsonwebtoken::EncodingKey::from_ed_der` expects, so that the
# positive EdDSA case exercises the same signing path a real device would.
ed25519-dalek = { version = "2", features = ["pkcs8"] }
# Only `tests/rejection_logging.rs` needs it: the point of that file is that a
# rejection reason reaches the logs, which nothing can assert without reading
# them back.
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[features]
default = []
