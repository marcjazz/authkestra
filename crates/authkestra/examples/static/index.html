<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authkestra Example</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
        .card { border: 1px solid #ddd; padding: 1.5rem; border-radius: 8px; background: #f9f9f9; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 0.5rem 1rem; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #0056b3; }
        pre { background: #eee; padding: 1rem; overflow-x: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Authkestra Example</h1>
    <div id="app" class="card">
        <p>Loading...</p>
    </div>

    <script>
        // The login route is `/auth/login/{provider}`, so the page asks the
        // example which providers its engine actually has rather than
        // hardcoding one. Examples that register none (e.g. *_basic_setup)
        // legitimately have nothing to link to.
        async function fetchProviders() {
            try {
                const res = await fetch('/api/providers');
                if (!res.ok) return [];
                const body = await res.json();
                return body.providers || [];
            } catch (err) {
                return [];
            }
        }

        async function checkStatus() {
            const app = document.getElementById('app');
            try {
                const res = await fetch('/api/user');
                if (res.ok) {
                    const user = await res.json();
                    app.innerHTML = `
                        <h2>Welcome, ${user.id}!</h2>
                        <p>You are successfully authenticated.</p>
                        <h3>User Data:</h3>
                        <pre>${JSON.stringify(user, null, 2)}</pre>
                        <a href="/auth/logout" class="btn">Logout</a>
                    `;
                    return;
                }

                const providers = await fetchProviders();
                const buttons = providers
                    .map(p => `<a href="/auth/login/${p}" class="btn">Login with ${p}</a>`)
                    .join(' ');
                app.innerHTML = `
                    <h2>Not Authenticated</h2>
                    <p>Please log in to continue.</p>
                    <div id="login-methods">
                        ${buttons || '<p><em>This example registers no OAuth providers.</em></p>'}
                    </div>
                `;
            } catch (err) {
                console.error(err);
                app.innerHTML = '<h2>Error</h2><p>Could not reach the example server.</p>';
            }
        }
        checkStatus();
    </script>
</body>
</html>
