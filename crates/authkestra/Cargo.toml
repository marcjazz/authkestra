[package]
exclude.workspace = true
name = "authkestra"
version.workspace = true
edition.workspace = true
description = "A modular authentication framework for Rust"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
authkestra-engine = { workspace = true }
authkestra-oidc = { workspace = true, optional = true }
authkestra-axum = { workspace = true, optional = true }
authkestra-actix = { workspace = true, optional = true }
authkestra-providers = { workspace = true, optional = true }
authkestra-resource = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

authkestra-engine = { workspace = true, features = ["token", "session", "memory", "redis", "sql-sqlite", "totp", "webauthn"] }
authkestra-resource = { workspace = true }
authkestra-providers = { workspace = true, features = ["github", "google", "discord"] }
authkestra-oidc = { workspace = true }
authkestra-op = { workspace = true, features = ["sqlx-sqlite"] }
authkestra-macros = { workspace = true }
authkestra-devsig = { workspace = true }
authkestra-axum = { workspace = true, features = ["devsig", "macros", "session", "token", "resource", "op", "captcha"] }
authkestra-actix = { workspace = true, features = ["devsig", "macros", "session", "token", "resource", "op", "captcha"] }

dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
redis = { version = "0.27", features = ["tokio-comp"] }
tower-http = { version = "0.6", features = ["fs"] }
actix-files = "0.6"
rsa = "0.9"
p256 = { version = "0.13", features = ["pem", "ecdsa", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.91"
webauthn-rs = "0.5.0"
url = "2.5"
axum = { version = "0.8.8", features = ["macros"] }
actix-web = "4"
tower-cookies = "0.11.0"
tower-layer = "0.3"
tower-service = "0.3"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
full = ["session", "token", "oidc", "axum", "actix", "github", "google", "discord"]

# Core features

session = ["authkestra-engine/session"]
token = ["authkestra-engine/token"]
oidc = ["dep:authkestra-oidc"]
resource = ["dep:authkestra-resource", "authkestra-actix?/resource", "authkestra-axum?/resource"]

# Web frameworks
axum = ["dep:authkestra-axum", "authkestra-axum/session", "authkestra-axum/token", "authkestra-axum/resource"]
actix = ["dep:authkestra-actix", "authkestra-actix/session", "authkestra-actix/token", "authkestra-actix/resource"]

# Providers
github = ["authkestra-providers/github"]
google = ["authkestra-providers/google"]
discord = ["authkestra-providers/discord"]






















[[test]]
name = "typestate_tests"
required-features = ["full"]

