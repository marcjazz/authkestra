[package]
exclude.workspace = true
name = "authkestra-actix"
version = "0.2.4"
edition.workspace = true
description = "Actix-web integration for the authkestra authentication framework"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
authkestra-engine = { workspace = true }
authkestra-resource = { workspace = true, optional = true }
authkestra-op = { workspace = true, optional = true }
authkestra-macros = { workspace = true, optional = true, features = ["actix"] }
authkestra-devsig = { workspace = true, optional = true }
actix-web = "4"
actix-utils = "3"
futures-util = "0.3"
futures = "0.3"
jsonwebtoken = "10.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
http = "1"

[dev-dependencies]

authkestra = { workspace = true, features = ["full"] }
authkestra-engine = { workspace = true, features = ["flow", "token", "session", "memory", "redis", "sql-sqlite", "totp", "webauthn"] }
authkestra-resource = { workspace = true }
authkestra-providers = { workspace = true, features = ["github", "google", "discord"] }
authkestra-oidc = { workspace = true }
authkestra-op = { workspace = true, features = ["sqlx-sqlite"] }
authkestra-macros = { workspace = true }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.13", features = ["json"] }
tower-http = { version = "0.6", features = ["fs"] }
actix-files = "0.6"

tokio = { version = "1", features = ["full"] }
rsa = "0.9"
p256 = { version = "0.13", features = ["pem", "ecdsa", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.91"

[features]
default = []
session = ["authkestra-engine/session"]
flow = ["authkestra-engine/flow", "authkestra-engine/session", "authkestra-engine/token"]
token = ["authkestra-engine/token"]
resource = ["dep:authkestra-resource"]
# Unlike authkestra-axum's `op` feature, this crate's own op.rs genuinely
# uses `AuthSession` (actix_authorize_handler checks for an existing
# browser session on /authorize to skip the login redirect) — AuthSession's
# `FromRequest` impl here is gated on `all(flow, session)` because it reads
# `SessionConfig` from actix app-data, and `SessionConfig` only exists
# under `flow`. So `op` must enable `flow` itself in this crate, not just
# `session` + `token` — omitting it left `--features op` uncompilable
# standalone (`Option<AuthSession>` required `AuthSession: FromRequest`,
# which didn't exist without `flow`).
op = ["dep:authkestra-op", "flow", "session", "token"]
macros = ["dep:authkestra-macros"]
captcha = ["authkestra-engine/captcha"]
devsig = ["dep:authkestra-devsig"]

[[example]]
name = "actix_devsig"
path = "examples/devsig/main.rs"
required-features = ["devsig"]
